# STUDYPAL - Debug APK builder (GitHub Actions)
# Is file ko repo mein yahan rakho:  .github/workflows/build-apk.yml
#
# Pichle build ka error: Keystore file '.../debug.keystore' not found for signing config 'debugConfig'
# (debug.keystore .gitignore mein hai, isliye repo mein nahi tha). Ye file wo keystore khud bana deti hai.

name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # FIX 1: debug.keystore (build.gradle.kts ke debugConfig ko chahiye)
      # Agar GitHub Secret DEBUG_KEYSTORE_BASE64 set hai to wahi keystore use hoga
      # (har build ka signature same rahega -> phone par naya APK purane ke upar install ho jata hai).
      # Secret nahi hai to nayi keystore ban jati hai (build chalega, par har baar signature badlega).
      - name: Create debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # FIX 2: AI chat ki API key (.env gitignored hai, isliye CI build mein key khali/placeholder jati thi)
      # GitHub -> Settings -> Secrets and variables -> Actions -> OPENROUTER_API_KEY add karo.
      - name: Create .env from secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          {
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-YOUR_OPENROUTER_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY:-YOUR_OPENAI_API_KEY}"
          } > .env

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: STUDYPAL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14